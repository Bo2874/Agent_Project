name: personal-agent-dev

x-runtime-environment: &runtime-environment
  APP_ENV: development
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: "${DEV_DB_NAME:-personal_agent_dev}"
  DB_USER: "${DEV_DB_USER:-agent}"
  DB_PASSWORD: "${DEV_DB_PASSWORD:-dev-only-postgres-password}"
  AUTH_SECRET_KEY: "${DEV_AUTH_SECRET_KEY:-dev-only-auth-secret-change-before-sharing}"
  AUTH_COOKIE_SECURE: "false"
  DEEPSEEK_API_KEY: "${DEV_DEEPSEEK_API_KEY:-}"
  DEEPSEEK_MODEL: "${DEV_DEEPSEEK_MODEL:-deepseek-flash}"
  OPENROUTER_API_KEY: "${DEV_OPENROUTER_API_KEY:-}"
  JEV_BASE_URL: "${DEV_JEV_BASE_URL:-https://openrouter.ai/api}"
  JEV_MODEL: "${DEV_JEV_MODEL:-typesafe/jev-1.14}"
  JEV_TIMEOUT_SECONDS: "${DEV_JEV_TIMEOUT_SECONDS:-15}"
  JEV_TOTAL_TIMEOUT_SECONDS: "${DEV_JEV_TOTAL_TIMEOUT_SECONDS:-20}"
  ROUTING_MODE: "${DEV_ROUTING_MODE:-active}"
  ROUTING_FALLBACK_ENABLED: "${DEV_ROUTING_FALLBACK_ENABLED:-true}"
  ROUTING_PRIMARY_TIMEOUT_SECONDS: "${DEV_ROUTING_PRIMARY_TIMEOUT_SECONDS:-8}"
  ROUTING_MAX_PROVIDER_CALLS: "${DEV_ROUTING_MAX_PROVIDER_CALLS:-12}"
  ROUTING_MAX_RESERVED_TOKENS: "${DEV_ROUTING_MAX_RESERVED_TOKENS:-20000}"
  ROUTING_MIN_PROBABILITY: "${DEV_ROUTING_MIN_PROBABILITY:-0.6}"
  ROUTING_MIN_MARGIN: "${DEV_ROUTING_MIN_MARGIN:-0.1}"
  ROUTING_BREAKER_THRESHOLD: "${DEV_ROUTING_BREAKER_THRESHOLD:-3}"
  ROUTING_BREAKER_COOLDOWN_SECONDS: "${DEV_ROUTING_BREAKER_COOLDOWN_SECONDS:-30}"
  ROUTING_ALLOW_EXTERNAL: "${DEV_ROUTING_ALLOW_EXTERNAL:-true}"
  ROUTING_SEND_OBSERVATIONS: "${DEV_ROUTING_SEND_OBSERVATIONS:-true}"
  ROUTING_REDACT_PII: "${DEV_ROUTING_REDACT_PII:-true}"
  ROUTING_MAX_STATE_CHARS: "${DEV_ROUTING_MAX_STATE_CHARS:-32768}"
  ROUTING_MAX_PAYLOAD_BYTES: "${DEV_ROUTING_MAX_PAYLOAD_BYTES:-131072}"
  MEMORY_EXTRACTION_ENABLED: "${DEV_MEMORY_EXTRACTION_ENABLED:-false}"
  MCP_DEMO_ENABLED: "true"
  MCP_STDIO_CONFIG_PATH: "${DEV_MCP_STDIO_CONFIG_PATH:-plugins/stdio/servers.json}"
  MCP_HTTP_CONFIG_PATH: "${DEV_MCP_HTTP_CONFIG_PATH:-plugins/http/servers.json}"
  PLUGIN_PACKAGES_CONFIG_PATH: "${DEV_PLUGIN_PACKAGES_CONFIG_PATH:-plugins/packages.json}"
  MCP_CREDENTIAL_ENCRYPTION_KEYS: "${DEV_MCP_CREDENTIAL_ENCRYPTION_KEYS:-}"
  PYTHON_SANDBOX_ENABLED: "false"
  EMAIL_ENABLED: "${DEV_EMAIL_ENABLED:-false}"
  SMTP_HOST: "${DEV_SMTP_HOST:-smtp.gmail.com}"
  SMTP_PORT: "${DEV_SMTP_PORT:-465}"
  SMTP_SECURITY: "${DEV_SMTP_SECURITY:-ssl}"
  SMTP_USERNAME: "${DEV_SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${DEV_SMTP_PASSWORD:-}"
  SMTP_FROM_EMAIL: "${DEV_SMTP_FROM_EMAIL:-}"
  SMTP_TIMEOUT_SECONDS: "${DEV_SMTP_TIMEOUT_SECONDS:-20}"
  LANGSMITH_TRACING_ENABLED: "false"
  LANGGRAPH_CHECKPOINT_AUTO_SETUP: "false"
  V2_ENABLED: "${DEV_V2_ENABLED:-false}"
  V2_PLUGINS_ENABLED: "${DEV_V2_PLUGINS_ENABLED:-false}"
  V2_ROUTING_ENABLED: "${DEV_V2_ROUTING_ENABLED:-false}"
  V2_RAG_ENABLED: "false"
  V2_PLANNING_ENABLED: "false"
  V2_PARALLEL_ENABLED: "false"
  V2_REDIS_CACHE_ENABLED: "false"
  V2_EVENTS_ENABLED: "false"
  DOCUMENT_STORAGE_PATH: /app/data/documents
  DOCUMENT_MAX_FILE_BYTES: "${DEV_DOCUMENT_MAX_FILE_BYTES:-20971520}"
  DOCUMENT_MAX_USER_BYTES: "${DEV_DOCUMENT_MAX_USER_BYTES:-209715200}"
  DOCUMENT_MAX_DOCUMENTS: "${DEV_DOCUMENT_MAX_DOCUMENTS:-1000}"
  DOCUMENT_MAX_UNPACKED_BYTES: "${DEV_DOCUMENT_MAX_UNPACKED_BYTES:-104857600}"
  DOCUMENT_MAX_ARCHIVE_ENTRIES: "${DEV_DOCUMENT_MAX_ARCHIVE_ENTRIES:-2000}"
  DOCUMENT_MAX_PAGES: "${DEV_DOCUMENT_MAX_PAGES:-500}"
  DOCUMENT_MAX_TEXT_CHARS: "${DEV_DOCUMENT_MAX_TEXT_CHARS:-5000000}"
  DOCUMENT_MAX_CHUNKS: "${DEV_DOCUMENT_MAX_CHUNKS:-20000}"
  DOCUMENT_MAX_ARTIFACT_BYTES: "${DEV_DOCUMENT_MAX_ARTIFACT_BYTES:-134217728}"
  DOCUMENT_PROCESS_TIMEOUT_SECONDS: "${DEV_DOCUMENT_PROCESS_TIMEOUT_SECONDS:-600}"
  DOCUMENT_PROCESS_MEMORY_MB: "${DEV_DOCUMENT_PROCESS_MEMORY_MB:-4096}"
  DOCUMENT_LIBREOFFICE_PATH: soffice
  DOCUMENT_MODEL_CACHE_PATH: /app/data/models
  DOCUMENT_EMBEDDING_REVISION: "${DEV_DOCUMENT_EMBEDDING_REVISION:-main}"
  DOCUMENT_EMBEDDING_BATCH_SIZE: "${DEV_DOCUMENT_EMBEDDING_BATCH_SIZE:-4}"
  DOCUMENT_EMBEDDING_TIMEOUT_SECONDS: "${DEV_DOCUMENT_EMBEDDING_TIMEOUT_SECONDS:-600}"
  DOCUMENT_EMBEDDING_MEMORY_MB: "${DEV_DOCUMENT_EMBEDDING_MEMORY_MB:-4096}"
  DOCUMENT_RERANKER_REVISION: "${DEV_DOCUMENT_RERANKER_REVISION:-main}"
  DOCUMENT_RERANKER_BATCH_SIZE: "${DEV_DOCUMENT_RERANKER_BATCH_SIZE:-1}"
  DOCUMENT_RERANKER_TIMEOUT_SECONDS: "${DEV_DOCUMENT_RERANKER_TIMEOUT_SECONDS:-600}"
  DOCUMENT_RERANKER_MEMORY_MB: "${DEV_DOCUMENT_RERANKER_MEMORY_MB:-4096}"
  DOCUMENT_REWRITE_TIMEOUT_SECONDS: "${DEV_DOCUMENT_REWRITE_TIMEOUT_SECONDS:-30}"
  DOCUMENT_REWRITE_HISTORY_MESSAGES: "${DEV_DOCUMENT_REWRITE_HISTORY_MESSAGES:-8}"
  DOCUMENT_REWRITE_HISTORY_TOKENS: "${DEV_DOCUMENT_REWRITE_HISTORY_TOKENS:-2000}"
  BACKGROUND_QUEUE_NAME: default
  BACKGROUND_WORKER_HEARTBEAT_PATH: /tmp/agent-worker/heartbeat.json
  BACKGROUND_WORKER_HEARTBEAT_MAX_AGE_SECONDS: "15"

x-runtime: &runtime
  init: true
  environment: *runtime-environment
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 45s

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: "${DEV_DB_NAME:-personal_agent_dev}"
      POSTGRES_USER: "${DEV_DB_USER:-agent}"
      POSTGRES_PASSWORD: "${DEV_DB_PASSWORD:-dev-only-postgres-password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped
    shm_size: 128mb

  migrate:
    <<: *runtime
    image: "${DEV_IMAGE_PREFIX:-personal-agent}-migrate:${DEV_IMAGE_TAG:-dev}"
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
      target: migrate
    command: [python, -m, scripts.migrate_database]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  app:
    <<: *runtime
    image: "${DEV_IMAGE_PREFIX:-personal-agent}-app:${DEV_IMAGE_TAG:-dev}"
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
      target: app
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8000}:8000"
    volumes:
      - document_data:/app/data/documents
      - document_model_cache:/app/data/models
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *runtime
    image: "${DEV_IMAGE_PREFIX:-personal-agent}-worker:${DEV_IMAGE_TAG:-dev}"
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
      target: worker
    volumes:
      - document_data:/app/data/documents
      - document_model_cache:/app/data/models
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  document_data:
  document_model_cache:
