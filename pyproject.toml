[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-agent"
version = "0.1.0"
description = "Personalized multi-user AI Agent web application"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.25,<5",
    "langchain>=1.4.3,<1.5",
    "langchain-deepseek>=1.1.1,<1.2",
    "langgraph>=1.2.12,<1.3",
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "langsmith>=0.14.4,<0.15",
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-retrievers-bm25>=0.8.0,<0.9",
    "llama-index-vector-stores-postgres>=0.9.0,<0.10",
    "mcp>=2.2,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "pyyaml>=6,<7",
]

[tool.uv]
required-version = "==0.13.1"
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
include = ["agent_core*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = ".venv/.pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".venv/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
